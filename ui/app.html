<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Context Monitor</title>
<style>
  :root {
    --bg-primary: var(--color-background-primary, #14161a);
    --bg-secondary: var(--color-background-secondary, #1c1f26);
    --bg-tertiary: var(--color-background-tertiary, #262a34);
    --text-primary: var(--color-text-primary, #f1f5f9);
    --text-secondary: var(--color-text-secondary, #94a3b8);
    --text-tertiary: var(--color-text-tertiary, #64748b);
    --border-primary: var(--color-border-primary, #2a2f3a);
    --hover-border: #3b4252;
    --btn-hover-bg: #333947;
    --btn-border: #3b4252;
    --btn-hover-border: #4f586e;
    --toast-bg: #1e293b;
    --toast-text: #f8fafc;
    --toast-border: #334155;
    --accent-blue: #3b82f6;
    --accent-orange: #f97316;
    --accent-green: #10b981;
    --accent-yellow: #eab308;
    --accent-gray: #94a3b8;
    --accent-darkgray: #64748b;
    --buffer-color: #475569;
  }

  :root[data-theme="light"] {
    --bg-primary: var(--color-background-primary, #ffffff);
    --bg-secondary: var(--color-background-secondary, #f8fafc);
    --bg-tertiary: var(--color-background-tertiary, #e2e8f0);
    --text-primary: var(--color-text-primary, #0f172a);
    --text-secondary: var(--color-text-secondary, #475569);
    --text-tertiary: var(--color-text-tertiary, #64748b);
    --border-primary: var(--color-border-primary, #cbd5e1);
    --hover-border: #94a3b8;
    --btn-hover-bg: #cbd5e1;
    --btn-border: #cbd5e1;
    --btn-hover-border: #94a3b8;
    --toast-bg: #0f172a;
    --toast-text: #f8fafc;
    --toast-border: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif);
    font-size: 13px;
    line-height: 1.5;
    padding: 14px 16px;
    user-select: none;
    overflow-x: hidden;
  }

  /* コンテナ */
  .container {
    max-width: 480px;
    margin: 0 auto;
  }

  /* ヘッダー（コンテキスト + 操作ボタン） */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border-color: var(--border-primary);
  }

  /* シンプルバー領域（クリックで開閉可能） */
  .simple-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .simple-card:hover {
    border-color: var(--hover-border);
  }

  .usage-summary-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .session-subtitle {
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: -4px;
    margin-bottom: 7px;
  }

  .usage-left {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .usage-percent {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .usage-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .usage-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .chevron {
    display: inline-block;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    color: var(--text-secondary);
    transition: transform 0.2s ease;
    font-size: 11px;
  }

  .expanded .chevron {
    transform: rotate(180deg);
  }

  /* マルチセグメント・プログレスバー */
  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--bg-tertiary);
    border-radius: 999px;
    overflow: hidden;
    display: flex;
    gap: 1.5px;
  }

  .progress-segment {
    height: 100%;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 0;
  }

  .progress-segment:first-child {
    border-top-left-radius: 999px;
    border-bottom-left-radius: 999px;
  }

  /* 展開される詳細パネル */
  .details-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border-primary);
    animation: fadeIn 0.18s ease-out;
  }

  .expanded .details-panel {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 圧縮の目安上限 */
  .threshold-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .threshold-title {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .threshold-select {
    background: transparent;
    color: var(--text-primary);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 2px 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
  }

  .threshold-select:hover {
    background: var(--bg-tertiary);
    border-color: var(--border-primary);
  }

  .threshold-select option {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }

  .threshold-desc {
    font-size: 11.5px;
    color: var(--text-tertiary);
    line-height: 1.45;
    margin-bottom: 14px;
  }

  /* カテゴリ別リスト */
  .category-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }

  .category-item {
    display: grid;
    grid-template-columns: 14px 1fr auto 52px;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    padding: 2px 0;
  }

  .cat-dot {
    width: 9px;
    height: 9px;
    border-radius: 2.5px;
  }

  .cat-name {
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-name.underlined {
    text-decoration: underline;
    text-decoration-color: rgba(148, 163, 184, 0.35);
    text-underline-offset: 3px;
  }

  .cat-tokens {
    color: var(--text-tertiary);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .cat-pct {
    color: var(--text-primary);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .divider {
    height: 1px;
    background: var(--border-primary);
    margin: 10px 0;
  }

  /* 折りたたみサブセクション（ツール内訳・セッション切り替え） */
  .sub-accordion {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 10px 0;
  }

  .sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-secondary);
    font-size: 12.5px;
    cursor: pointer;
    padding: 3px 0;
  }

  .sub-header:hover {
    color: var(--text-primary);
  }

  .sub-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sub-arrow {
    font-size: 10px;
    color: var(--text-tertiary);
    transition: transform 0.15s ease;
    display: inline-block;
  }

  .sub-open .sub-arrow {
    transform: rotate(90deg);
  }

  .sub-body {
    display: none;
    padding: 6px 8px 6px 16px;
    background: var(--bg-primary);
    border-radius: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
  }

  .sub-open .sub-body {
    display: block;
  }

  .tool-row {
    display: flex;
    justify-content: space-between;
    padding: 2px 0;
  }

  /* フッター：自動コンパクトまで & セッションを圧縮ボタン */
  .compact-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--border-primary);
  }

  .compact-remaining {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .compact-btn {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--btn-border);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .compact-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
  }

  .compact-btn:active {
    transform: scale(0.98);
  }

  /* セッション選択 & 成果物セクション */
  .extra-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border-primary);
  }

  .extra-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .session-select {
    width: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--border-primary);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
  }

  .artifact-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .artifact-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
  }

  .artifact-item:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }

  /* Usage（クォータ残量）カード */
  .usage-card {
    margin-top: 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-primary);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .usage-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    cursor: pointer;
  }

  .usage-group {
    margin-bottom: 14px;
  }

  .usage-group:last-child {
    margin-bottom: 0;
  }

  .usage-group-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .usage-bucket-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .usage-bucket-row:last-child {
    margin-bottom: 0;
  }

  .usage-bucket-left {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .usage-window-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .usage-reset-label {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .usage-bucket-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }

  .ring-gauge {
    width: 18px;
    height: 18px;
    transform: rotate(-90deg);
    flex-shrink: 0;
  }

  .ring-bg {
    fill: none;
    stroke: var(--bg-tertiary);
    stroke-width: 2.4;
  }

  .ring-fg {
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.35s ease;
  }

  .usage-mini-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    cursor: pointer;
  }

  .usage-mini-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-primary);
    font-size: 11.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }

  .usage-mini-chip-pct {
    font-weight: 700;
    color: var(--text-primary);
  }

  .ring-gauge-sm {
    width: 13px;
    height: 13px;
    transform: rotate(-90deg);
    flex-shrink: 0;
  }

  .toast {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: var(--toast-bg);
    color: var(--toast-text);
    border: 1px solid var(--toast-border);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- 上部タイトルと更新トグル -->
    <div class="section-header">
      <div class="section-title">
        <span class="live-dot" id="liveDot" title="自動更新ON (5秒おき)"></span>
        <span id="headerTitle">コンテキスト</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" title="今すぐ最新のログを集計">↻ 更新</button>
        <button class="icon-btn" id="toggleExpandBtn" title="シンプル表示 / 詳細表示を切り替え">詳細 ▾</button>
      </div>
    </div>

    <!-- メインカード（シンプル版はバーのみ、クリックで詳細展開） -->
    <div class="simple-card" id="mainCard">
      <div class="usage-summary-row" id="summaryHeader">
        <div class="usage-left">
          <span class="usage-percent" id="usagePercentText">0%</span>
          <span class="usage-label" id="usageLabel">使用</span>
        </div>
        <div class="usage-right">
          <span id="usageFractionText">0 / 400k</span>
          <span class="chevron" id="mainChevron" title="クリックで詳細を展開/折りたたみ">▾</span>
        </div>
      </div>

      <!-- 監視対象セッション名 -->
      <div class="session-subtitle" id="sessionSubtitle"></div>

      <!-- マルチカラー・プログレスバー -->
      <div class="progress-track" id="progressTrack">
        <div class="progress-segment" style="width: 5%; background: #3b82f6;"></div>
      </div>

      <!-- 展開時の詳細エリア（クリックイベントの伝播を止める） -->
      <div class="details-panel" id="detailsPanel">
        <!-- 圧縮の目安上限 -->
        <div class="threshold-row">
          <span class="threshold-title" id="thresholdTitle">圧縮の目安上限</span>
          <select class="threshold-select" id="thresholdSelect">
            <option value="200000">200k</option>
            <option value="400000" selected>400k</option>
            <option value="1000000">1,000k</option>
            <option value="2000000">2,000k</option>
          </select>
        </div>
        <div class="threshold-desc" id="thresholdDesc">
          バーの100%基準と /compact 実行の目安値です。<br/>
          ※ Antigravity 本体の自動圧縮設定は変更されません。
        </div>

        <!-- カテゴリ別トークン内訳 -->
        <div class="category-list" id="categoryList"></div>

        <div class="divider"></div>

        <!-- バッファと空き容量 -->
        <div class="category-list" id="capacityList"></div>

        <div class="divider"></div>

        <!-- キャッシュヒット率・最新ターン詳細 -->
        <div class="category-list" id="cacheList"></div>

        <!-- 折りたたみ項目（実行ツール内訳 / Skills） -->
        <div class="sub-accordion">
          <div id="toolsSubSection">
            <div class="sub-header" id="toolsSubHeader">
              <div class="sub-header-left">
                <span class="sub-arrow">❯</span>
                <span id="toolsHeaderLabel">ツール呼び出し回数</span>
              </div>
              <span id="toolsTotalCount">0</span>
            </div>
            <div class="sub-body" id="toolsSubBody"></div>
          </div>

          <div id="skillsSubSection">
            <div class="sub-header" id="skillsSubHeader">
              <div class="sub-header-left">
                <span class="sub-arrow">❯</span>
                <span id="skillsHeaderLabel">利用可能な Skills</span>
              </div>
              <span id="skillsTotalCount">0</span>
            </div>
            <div class="sub-body" id="skillsSubBody">
              システムおよびグローバル設定から読み込まれたスキル定義数です。
            </div>
          </div>
        </div>

        <!-- 目安上限までの残量 & /compact コピーボタン -->
        <div class="compact-footer">
          <span class="compact-remaining" id="remainingCompactText">目安まであと -- トークン</span>
          <button class="compact-btn" id="compactBtn" title="/compact をクリップボードにコピーします（チャット欄に貼り付けて実行してください）">/compact をコピー</button>
        </div>

        <!-- 成果物（Artifacts）リスト -->
        <div class="extra-section" id="artifactsSection" style="display:none;">
          <div class="extra-title" id="artifactsTitle">成果物</div>
          <div class="artifact-list" id="artifactList"></div>
        </div>

        <!-- セッション切り替え -->
        <div class="extra-section">
          <div class="extra-title">
            <span id="sessionHeaderLabel">監視セッション</span>
            <span id="updatedAtText" style="font-weight:400; font-size:11px; color:var(--text-tertiary);"></span>
          </div>
          <select class="session-select" id="sessionSelect"></select>
        </div>

        <!-- 表示言語設定 -->
        <div class="extra-section">
          <div class="threshold-row" style="margin-bottom:0;">
            <span class="threshold-title" id="languageLabel">表示言語 / Language</span>
            <select class="threshold-select" id="languageSelect">
              <option value="auto">Auto</option>
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="zh">简体中文</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Usage（モデル別クォータ残量）カード -->
    <div class="usage-card" id="usageCard" style="display:none;">
      <div class="usage-card-header" id="usageCardHeader" title="クリックでUsage詳細を展開/最小化" style="margin-bottom:0;">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
          <span id="usageCardTitle" style="font-weight:600; color:var(--text-primary); font-size:13px;">Usage</span>
          <span id="usageActiveModelLabel" style="font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <span id="usageMinimizedSummary" style="display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--text-secondary); font-variant-numeric:tabular-nums;"></span>
          <span class="chevron" id="usageChevron">▾</span>
        </div>
      </div>
      <div class="usage-mini-list" id="usageMinimizedList" style="display:none;" title="クリックでUsage詳細を展開"></div>
      <div id="usageGroupsContainer" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--border-primary);"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function() {
  const AUTO_FOLLOW_VALUE = "__auto__";
  const RPC_TIMEOUT_MS = 15000;

  // XSS対策用HTMLエスケープヘルパー
  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // CSSカラー値の簡易サニタイズ
  function sanitizeColor(color, fallback) {
    const c = String(color || "").trim();
    if (/^#[0-9a-fA-F]{3,8}$/.test(c) || /^rgba?\([^)]+\)$/.test(c) || /^[a-zA-Z]+$/.test(c)) {
      return c;
    }
    return fallback || "#94a3b8";
  }

  // トークン数の k 表記フォーマット（例: 500 / 1.5k / 136k / 400k / 1,000k）
  function formatTokens(num) {
    num = Number(num) || 0;
    if (num < 1000) {
      return Math.round(num).toLocaleString("en-US");
    }

  function resolveLang() {
    if (state.language === "ja" || state.language === "en" || state.language === "zh") {
      return state.language;

    const loc = String(state.hostLocale || navigator.language || "en").toLowerCase();
    if (loc.startsWith("ja")) return "ja";
    if (loc.startsWith("zh")) return "zh";
    return "en";

  function translateWindowLabel(raw) {
    const s = String(raw || "").trim();
    const sl = s.toLowerCase();
    if (sl === "weekly limit") return t("windowWeekly");
    if (sl === "5h limit") return t("window5h");
    return s;
  }

  function translateResetDuration(raw) {
    const s = String(raw || "").trim();
    if (!s) return "";
    const lang = resolveLang();
    if (lang === "ja") {
      if (s.toLowerCase() === "soon") return t("resetSoon");
      return s
        .replace(/(\d+)\s*d\b/gi, "$1日")
        .replace(/(\d+)\s*h\b/gi, "$1時間")
        .replace(/(\d+)\s*m\b/gi, "$1分")
        .replace(/\s+/g, "");
    }
    if (lang === "zh") {
      if (s.toLowerCase() === "soon") return t("resetSoon");
      return s
        .replace(/(\d+)\s*d\b/gi, "$1天")
        .replace(/(\d+)\s*h\b/gi, "$1小时")
        .replace(/(\d+)\s*m\b/gi, "$1分钟")
        .replace(/\s+/g, "");
    }
    return s;
  }

    if (typeof saved.language === "string" && ["auto", "ja", "en", "zh"].includes(saved.language)) {
      state.language = saved.language;

      state.threshold = saved.threshold;
      const strVal = String(saved.threshold);

        customOpt.value = strVal;

      setExpanded(saved.expanded, false);

      usageCollapsed = saved.usageCollapsed;
      updateUsageCollapseUI();

    pct.className = "cat-pct";
    pct.textContent = pctText;

    row.appendChild(dot);
    row.appendChild(name);
    row.appendChild(tokens);
    row.appendChild(pct);
    return row;
  }

  // UI描画
  function renderStats(data) {
    if (!data || data.error) return;
    state.stats = data;

    if (data.savedSettings && !state.settingsHydrated) {
      applyHydratedSettings(data.savedSettings);
    }

    const lang = resolveLang();
    const dict = I18N[lang] || I18N.en;
    const used = data.totalUsedTokens || 0;
    const threshold = data.autoCompactThreshold || state.threshold || 400000;
    const pct = Math.min(100, Math.round((used / threshold) * 100));

    document.getElementById("usagePercentText").textContent = pct + "%";
    document.getElementById("usageFractionText").textContent =
      formatTokens(used) + " / " + formatTokens(threshold);

    const subEl = document.getElementById("sessionSubtitle");
    const rawTitle = data.sessionTitle || (data.sessionId ? data.sessionId.slice(0, 8) : "");
    const displayTitle = (rawTitle === "新規セッション (未送信)") ? t("newSessionTitle") : rawTitle;
    if (!displayTitle) {
      subEl.textContent = "";
      subEl.title = "";
    } else if (state.userSelectedSession) {
      subEl.textContent = `${t("pinnedPrefix")}: ${displayTitle}`;
      subEl.title = t("pinnedTooltip", displayTitle);
    } else {
      subEl.textContent = `${t("latestPrefix")}: ${displayTitle}`;
      subEl.title = t("latestTooltip", displayTitle);
    }
    if (data.updatedAt) {
      document.getElementById("updatedAtText").textContent = t("updatedAt", data.updatedAt);
    }

    // ツール呼び出し合計をカテゴリ詳細文言用に先に算出
    const toolCounts = data.toolCallCounts || {};
    const toolEntries = Object.entries(toolCounts).sort((a, b) => b[1] - a[1]);
    const totalTools = toolEntries.reduce((acc, cur) => acc + cur[1], 0);
    const stepCount = data.stepCount || 0;

    function getCategoryLabel(cat) {
      return (dict.catLabel && dict.catLabel[cat.id]) || cat.label || "";
    }

    function getCategoryDetail(cat) {
      const fn = dict.catDetail && dict.catDetail[cat.id];
      if (typeof fn === "function") {
        if (cat.id === "messages") return fn(stepCount);
        if (cat.id === "system_tools") return fn(totalTools);

    progressTrack.innerHTML = "";
    categories.forEach((cat) => {

    // 成果物リスト（DOM APIで安全に構築）

          const chip = document.createElement("span");

              <div class="usage-bucket-right">

                <svg class="ring-gauge" viewBox="0 0 20 20">

        } else {

          items.forEach((it) => {
            const pctLeft = Math.max(0, Math.min(100, Number(it.percentLeft) || 0));
            const offset = circumference - (pctLeft / 100) * circumference;
            const strokeColor = pctLeft <= 10 ? "#ef4444" : (pctLeft <= 30 ? "#eab308" : "#22c55e");
            const winText = translateWindowLabel(it.windowLabel);
            const resetDur = translateResetDuration(it.resetIn);
            const resetHtml = resetDur
              ? `<div class="usage-reset-label">${escapeHtml(t("resetsIn", resetDur))}</div>`
              : "";
            rowsHtml += `

                <div class="usage-bucket-right">

                  <svg class="ring-gauge" viewBox="0 0 20 20">
                    <circle class="ring-bg" cx="10" cy="10" r="${radius}"></circle>
                    <circle class="ring-fg" cx="10" cy="10" r="${radius}"

      updateUsageCollapseUI();
    } else if (data.quotaStatus === "unavailable") {
      quotaUnavailableCount += 1;
      usageCard.style.display = "block";
      usageMinimizedList.innerHTML = "";
      const isInitialRetry = quotaUnavailableCount < 2;
      usageActiveModelLabel.textContent = isInitialRetry ? t("quotaLoadingShort") : t("quotaUnavailableShort");
      usageActiveModelLabel.title = isInitialRetry
        ? t("quotaLoadingTitle")
        : t("quotaUnavailableTitle");
      usageMinimizedSummary.textContent = isInitialRetry ? t("quotaLoadingSummary") : t("quotaUnavailableSummary");
      usageGroupsContainer.innerHTML = "";
      const msgDiv = document.createElement("div");
      msgDiv.style.fontSize = "12px";
      msgDiv.style.color = "var(--text-tertiary)";
      msgDiv.textContent = isInitialRetry
        ? t("quotaLoadingMsg")
        : t("quotaUnavailableMsg");
      usageGroupsContainer.appendChild(msgDiv);
      updateUsageCollapseUI();
    } else {
      quotaUnavailableCount = 0;
      usageMinimizedList.innerHTML = "";
      usageCard.style.display = "none";
      updateExpandButtonLabel();
    }

    notifySizeChanged();
  }

  // --- MCP App postMessage JSON-RPC Bridge ---
  let nextRpcId = 1;
  const pendingRpc = new Map();

  function sendRpcRequest(method, params) {
    return new Promise((resolve, reject) => {
      const id = nextRpcId++;
      const timerId = setTimeout(() => {
        if (pendingRpc.has(id)) {
          pendingRpc.delete(id);
          reject(new Error(`RPC timeout: ${method}`));
        }
      }, RPC_TIMEOUT_MS);
      pendingRpc.set(id, { resolve, reject, timerId });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });
  }

  function sendRpcNotification(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  }

  function notifySizeChanged() {
    requestAnimationFrame(() => {
      const height = document.documentElement.scrollHeight;
      sendRpcNotification("ui/notifications/size-changed", { height });
    });
  }

  function inferThemeFromColor(colorStr) {
    const c = String(colorStr || "").trim();
    if (!c) return null;
    let r, g, b;
    const hexMatch = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i);
    if (hexMatch) {
      let hex = hexMatch[1];
      if (hex.length === 3) {
        r = parseInt(hex[0] + hex[0], 16);
        g = parseInt(hex[1] + hex[1], 16);
        b = parseInt(hex[2] + hex[2], 16);
      } else {
        r = parseInt(hex.slice(0, 2), 16);
        g = parseInt(hex.slice(2, 4), 16);
        b = parseInt(hex.slice(4, 6), 16);
      }
    } else {
      const rgbMatch = c.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/i);
      if (!rgbMatch) return null;
      r = Number(rgbMatch[1]);
      g = Number(rgbMatch[2]);
      b = Number(rgbMatch[3]);
    }
    const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return luminance > 128 ? "light" : "dark";
  }

  function applyThemeVariables(ctx) {
    if (!ctx) return;

    let nextTheme = null;
    if (typeof ctx.theme === "string" && ctx.theme.trim()) {
      const tl = ctx.theme.trim().toLowerCase();
      if (tl.includes("light")) nextTheme = "light";
      else if (tl.includes("dark")) nextTheme = "dark";
    }

    const vars = (ctx.styles && ctx.styles.variables && typeof ctx.styles.variables === "object")
      ? ctx.styles.variables
      : null;

    if (!nextTheme && !vars) {
      return;
    }

    if (!nextTheme && vars) {
      nextTheme = inferThemeFromColor(vars["--color-background-primary"] || vars["--bg-primary"]);
    }

    const themeChanged = Boolean(nextTheme && nextTheme !== state.currentTheme);
    if (themeChanged || vars) {
      // テーマ変化時または新しいスタイル変数到着時に前回インライン設定したホスト変数をクリア
      appliedHostVarKeys.forEach((k) => {
        document.documentElement.style.removeProperty(k);
      });
      appliedHostVarKeys.clear();
    }

    if (nextTheme) {
      document.documentElement.dataset.theme = nextTheme;
      document.documentElement.style.colorScheme = nextTheme;
      state.currentTheme = nextTheme;
    }

    if (vars) {
      for (const [k, v] of Object.entries(vars)) {
        if (v) {
          document.documentElement.style.setProperty(k, v);
          appliedHostVarKeys.add(k);
        }
      }
    }
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // レスポンスの処理
    if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
      const pending = pendingRpc.get(msg.id);
      if (pending) {
        clearTimeout(pending.timerId);
        pendingRpc.delete(msg.id);
        if (msg.error) pending.reject(msg.error);
        else pending.resolve(msg.result);
      }
      return;
    }

    // Host からの ping 等への応答
    if (msg.id !== undefined && msg.method === "ping") {
      window.parent.postMessage({ jsonrpc: "2.0", id: msg.id, result: {} }, "*");
      return;
    }

    // Host からの Notification
    if (msg.method === "ui/notifications/tool-input") {
      hasLiveRefresh = false;
      const args = (msg.params && msg.params.arguments) || {};
      if (args.session_id) {
        state.sessionId = args.session_id;
        state.userSelectedSession = true;
      }
    } else if (msg.method === "ui/notifications/tool-result") {
      const sc = msg.params && msg.params.structuredContent;
      if (sc && !hasLiveRefresh) renderStats(sc);
    } else if (msg.method === "ui/notifications/host-context-changed") {
      if (msg.params && msg.params.conversationId) {
        const prevConv = state.hostConversationId;
        state.hostConversationId = msg.params.conversationId;
        if (!state.userSelectedSession) {
          state.sessionId = msg.params.conversationId;
          if (prevConv !== msg.params.conversationId) {
            refreshStats();
          }
        }
      }
      if (msg.params && msg.params.locale && msg.params.locale !== state.hostLocale) {
        state.hostLocale = msg.params.locale;
        applyStaticTranslations();
        if (state.stats) {
          renderStats(state.stats);
        }
      }
      applyThemeVariables(msg.params);
    }
  });

  async function saveSettings(patch) {
    try {
      const cleanArgs = {};
      if (patch && typeof patch === "object") {
        for (const [k, v] of Object.entries(patch)) {
          if (v !== null && v !== undefined) {
            cleanArgs[k] = v;
          }
        }
      }
      await sendRpcRequest("tools/call", {
        name: "save_context_settings",
        arguments: cleanArgs
      });
    } catch (err) {
      // 設定保存失敗時はUI動作を止めない
    }
  }

  // サーバーツール呼び出しで最新データを取得（多重実行ガード付き）
  async function refreshStats() {
    if (isRefreshing) return { ok: false, busy: true };
    isRefreshing = true;
    try {
      const targetSid = state.userSelectedSession ? state.sessionId : state.hostConversationId;
      const args = { threshold: state.threshold };
      if (typeof targetSid === "string" && targetSid.trim()) {
        args.session_id = targetSid.trim();
      }
      const res = await sendRpcRequest("tools/call", {
        name: "refresh_context_stats",
        arguments: args
      });
      if (res && res.isError) {
        const textMsg = Array.isArray(res.content)
          ? res.content.map((c) => (c && c.text) || "").filter(Boolean).join(" ")
          : "";
        return { ok: false, error: textMsg || t("errTool") };
      }
      if (res && res.structuredContent) {
        hasLiveRefresh = true;
        renderStats(res.structuredContent);
        return { ok: true };
      }
      return { ok: false, error: t("errEmptyResponse") };
    } catch (err) {
      const errMsg = (err && (err.message || err.msg)) ? String(err.message || err.msg) : String(err || t("errRpc"));
      return { ok: false, error: errMsg };
    } finally {
      isRefreshing = false;
    }
  }

  function scheduleNextPoll() {
    if (pollTimerId) clearTimeout(pollTimerId);
    const isInitialQuotaRetry = !document.hidden && quotaUnavailableCount === 1;
    const delay = document.hidden ? 15000 : (isInitialQuotaRetry ? 2200 : 5000);
    pollTimerId = setTimeout(pollLoop, delay);
  }

  async function pollLoop() {
    await refreshStats();
    scheduleNextPoll();
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      refreshStats().then(scheduleNextPoll);
    } else {
      scheduleNextPoll();
    }
  });

  // ファイルビューで成果物を開く
  async function openFileInAuxPane(uri) {
    try {
      const res = await sendRpcRequest("com.google.antigravity/toggle-aux-pane", {
        tabType: "fileView",
        uri: uri
      });
      if (res && res.isError) {
        showToast(t("toastOpenPaneUnsupported"));
      }
    } catch (e) {
      showToast(t("toastOpenPaneFailed"));
    }
  }

  // イベントリスナー
  refreshBtn.addEventListener("click", async () => {
    const r = await refreshStats();
    if (r && r.ok) {
      showToast(t("toastRefreshed"));
    } else if (r && r.busy) {
      showToast(t("toastRefreshingBusy"));
    } else {
      showToast(t("toastRefreshFailed", (r && r.error) || t("unknownError")));
    }
  });

  thresholdSelect.addEventListener("change", (e) => {
    state.threshold = Number(e.target.value) || 400000;
    saveSettings({ threshold: state.threshold });
    refreshStats();
  });

  sessionSelect.addEventListener("change", (e) => {
    const val = e.target.value;
    if (val === AUTO_FOLLOW_VALUE) {
      state.userSelectedSession = false;
      state.sessionId = null;
    } else {
      state.sessionId = val;
      state.userSelectedSession = true;
    }
    refreshStats();
  });

  languageSelect.addEventListener("change", (e) => {
    const next = e.target.value;
    if (["auto", "ja", "en", "zh"].includes(next)) {
      state.language = next;
      saveSettings({ language: state.language });
      applyStaticTranslations();
      if (state.stats) {
        renderStats(state.stats);
      }
    }
  });

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {
        // sandboxed iframe で Clipboard API が拒否された場合は execCommand フォールバックへ進む
      }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return Boolean(ok);
    } catch (err) {
      return false;
    }
  }

  compactBtn.addEventListener("click", async () => {
    const ok = await copyTextToClipboard("/compact");
    if (ok) {
      showToast(t("toastCopiedCompact"));
    } else {
      showToast(t("toastCopyFailed"));
    }
  });

  // 初期化ハンドシェイク
  async function initApp() {
    applyStaticTranslations();
    try {
      const initRes = await sendRpcRequest("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "Context Monitor", version: "1.0.1" },
        appCapabilities: {}
      });
      if (initRes) {
        state.hostCapabilities = initRes.hostCapabilities || {};
        if (initRes.hostContext) {
          if (initRes.hostContext.conversationId) {
            state.hostConversationId = initRes.hostContext.conversationId;
            if (!state.userSelectedSession) {
              state.sessionId = initRes.hostContext.conversationId;
            }
          }
          if (initRes.hostContext.locale) {
            state.hostLocale = initRes.hostContext.locale;
          }
        }
        applyThemeVariables(initRes.hostContext);
      }
      applyStaticTranslations();
      updateCapabilityUI();
      sendRpcNotification("ui/notifications/initialized", {});
      notifySizeChanged();
      // 初回データ取得＆完了ベースの後続ポーリング開始
      setTimeout(async () => {
        await refreshStats();
        scheduleNextPoll();
      }, 200);
    } catch (e) {
      console.error("MCP App init error:", e);
    }
  }

  initApp();
})();
</script>
</body>
</html>
